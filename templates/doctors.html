{% extends "base.html" %}
{% block title%}
Doctors
{% endblock title%}
{% load static %}

{% block content%}
<h1 class="text-center"> Our Doctors </h1>
<hr>
<div class="container text-center bg-light">
    <link rel="stylesheet" href="{% static 'home/styles.css' %}">
{% for d in doctors %}
<!-- <h1>{{d.doc_name}}</h1> -->
<div class="card text-center mx-3 my-3" style="width: 18rem; display: inline-block;">
    <img class="card-img-top" src="{{d.doc_img.url}}" alt="Card image cap">
    <div class="card-body">
      <h5 class="card-title">{{d.doc_name}}</h5>
      <p class="card-text">{{d.doc_spec}}</p>
      <h6>{{d.dep_name}}</h6>

    </div>
  </div>
{% endfor %}

</div>
{% endblock content%}
