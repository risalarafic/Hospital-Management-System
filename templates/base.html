{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title%} {% endblock%}</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="{% static '/css/style.css'%}">

    <style>
        /* Make sure the page fills the full viewport height */
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        /* Reduce navbar height */ 
        .navbar {
            padding: 1px 0;
        }

        /* Push content to fill available space */
        .content {
            flex: 1;
        }

        /* Reduce footer height and make it stay at bottom */
        .footer {
            padding: 1px 0;
            font-size: 0.9rem;
            background-color: #007bff;
            color: white;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-md navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand text-white" href="#">CITY HOSPITAL</a>

            <!-- Navbar Toggle Button -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar Items -->
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="{% url 'home'%}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'about'%}">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'booking'%}">Booking</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'doctors'%}">Doctors</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'department'%}">Departments</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'contact'%}">Contact Us</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Block -->
    <div class="container my-4 content">
        {% block content%} {% endblock%}
    </div>

    <!-- Footer -->
    <footer class="footer text-light text-center">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6 text-start">
                    <h6>Emergency Contact Number: 0123456789</h6>
                </div>
                <div class="col-md-6 text-end">
                    <small>© 2022 City Hospital. All Rights Reserved</small>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
